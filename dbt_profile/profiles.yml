# NOTE, when saving this file, save it as profiles.yml NOT profile.yml. One has an "s" and the other doesn't. 
# DBT expect the profiles with an "s"
# If there is no "s" in the profiles, you will get an error and the airflow task will fail

data_platform:
  outputs:
    prod:
      account: "{{ env_var('DB_ACCOUNT') }}"
      warehouse: "{{ env_var('DB_WAREHOUSE') }}"
      database: "{{ env_var('DATABASE') }}"
      user: "{{ env_var('DB_USER') }}"
      password: "{{ env_var('DB_USER_PASSWORD') }}"
      role: "{{ env_var('DB_ROLE') }}"
      schema: silver
      threads: 8
      type: snowflake
  target: prod